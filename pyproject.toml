[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "systemone-harness"
version = "0.1.0"
description = "A tiny System One action harness and local inference runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typesafe-sdk>=0.6,<1",
  "pydantic>=2",
]

[project.optional-dependencies]
local = ["fastapi>=0.115", "uvicorn>=0.30"]
causal = ["torch>=2.6", "transformers>=5.16.1,<6", "accelerate>=1"]
laya = ["laya>=0.3.4,<1"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
systemone-harness = "systemone_harness.cli:main"
systemone-local = "systemone_local.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/systemone_harness", "src/systemone_local"]

[tool.pytest.ini_options]
pythonpath = ["src"]
