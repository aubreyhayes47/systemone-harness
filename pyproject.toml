[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "systemone-harness"
version = "0.1.0"
description = "A tiny action-selection harness on top of TypeSafe's official System One SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typesafe-sdk>=0.6,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
systemone-harness = "systemone_harness.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
